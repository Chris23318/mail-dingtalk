name: 邮件提醒推送钉钉

on:
  schedule:
    # 北京时间 10:00 = UTC 02:00
    - cron: '0 2 * * *'
    # 北京时间 17:00 = UTC 09:00
    - cron: '0 9 * * *'
  workflow_dispatch:   # 允许手动触发（用于测试）

jobs:
  send-mail-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 依赖
        run: echo "无需额外依赖，全部使用 Python 标准库"

      - name: 运行邮件推送脚本
        env:
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          BAIDU_APPID:      ${{ secrets.BAIDU_APPID }}
          BAIDU_KEY:        ${{ secrets.BAIDU_KEY }}
          IMAP_HOST:        imap.exmail.qq.com
          IMAP_PORT:        "993"
          ENABLE_TRANSLATE: "true"
          MAX_BODY_LENGTH:  "800"
        run: python mail_to_dingtalk.py
